<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b40"><link rel="manifest" href="manifest.json"><title>Home Inventory Manager</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#173247;font:16px system-ui}header{background:#102b40;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:16px}h1{font-size:25px;margin:8px 0}section,article{background:white;border-radius:12px;padding:16px;margin-bottom:14px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #b9c8d1;border-radius:7px}button{background:#126b75;color:white;cursor:pointer;border:0;margin:3px}button.secondary{background:#526678}label{display:grid;gap:5px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats article{flex:1;min-width:140px;background:#e3f2f2}.stats strong{display:block;font-size:25px}img{max-width:100%;object-fit:contain}#ad{text-align:center}#ad img{max-height:250px}#install{float:right}textarea{width:100%} [hidden]{display:none!important}.warning{color:#a54a00} @media print{header button,#ad,#tools,#editor,#filters,.actions{display:none!important}body{background:white}article{break-inside:avoid}}</style><header><button id="install">Install App</button><small>Elevor360D • FREE APP</small><h1>Home Inventory Manager</h1>Keep track of the things that matter.</header><main><section id="ad" hidden><a id="adlink" target="_blank" rel="noopener"><img id="adimage" alt="Advertisement"></a><div id="adtitle"></div><button id="prev">Previous</button><button id="next">Next</button></section><section><div class="stats"><article>Possessions<strong id="count">0</strong></article><article>Estimated value<strong id="total">£0</strong></article><article>Warranties due / expired<strong id="due">0</strong></article></div><div id="rooms"></div></section><section id="tools"><button id="add">+ Add possession</button><button id="print">Print insurance report</button><button id="backup">Backup</button><button id="restore">Restore</button><input type="file" id="restorefile" accept=".json" hidden><p><small>Records stay in this browser. Keep a backup somewhere safe; clearing browser data can remove records. Backups contain private information.</small></p></section><section id="editor" hidden><h2 id="editheading">Add possession</h2><form id="form"><div class="grid"><label>Item name<input name="name" required maxlength="150"></label><label>Room<input name="room" required list="roomlist"><datalist id="roomlist"><option>Living room</option><option>Kitchen</option><option>Bedroom</option><option>Garage</option><option>Garden</option><option>Bathroom</option></datalist></label><label>Category<select name="category"><option>Electronics</option><option>Furniture</option><option>Appliances</option><option>Jewellery</option><option>Tools</option><option>Clothing</option><option>Collectibles</option><option>Other</option></select></label><label>Purchase date<input type="date" name="purchase"></label><label>Purchase price (£)<input type="number" min="0" step="0.01" name="price"></label><label>Estimated value (£)<input type="number" min="0" step="0.01" name="value"></label><label>Brand / model<input name="model"></label><label>Serial number<input name="serial"></label><label>Warranty expiry<input type="date" name="warranty"></label><label>Item photograph<input type="file" id="photo" accept="image/*"><img id="photoPreview" style="max-height:120px"><button type="button" id="removePhoto" class="secondary">Remove photo</button></label><label>Receipt photograph<input type="file" id="receipt" accept="image/*"><img id="receiptPreview" style="max-height:120px"><button type="button" id="removeReceipt" class="secondary">Remove receipt</button></label></div><label>Notes / insurance details<textarea name="notes" rows="3"></textarea></label><button type="submit">Save possession</button><button type="button" id="cancel" class="secondary">Cancel</button></form></section><section id="filters"><div class="grid"><label>Search<input id="search" placeholder="Name, model, serial…"></label><label>Room<select id="roomfilter"></select></label><label>Category<select id="catfilter"></select></label><label>Warranty<select id="warfilter"><option value="">All</option><option value="due">Due within 30 days or expired</option></select></label></div></section><div id="items"></div></main><script src="app.js"></script></html>
